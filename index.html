<style>
  :root {
    --bg: #0a0b0d;
    --fg: #f2f3f5;
    --muted: #8b9099;
    --line: #1e2126;
    --accent: #6ee7ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'Chillax', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  /* Hero */
  .hero {
    height: 100vh;
    height: 100svh;
    min-height: 480px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .micro-slats,
  .particles-container {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .particles-canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Perspektif ızgara: ufka doğru akan sonsuz zemin (yalnızca ?bg=grid) */
  .grid-bg {
    display: none;
    position: absolute;
    inset: 0;
    overflow: hidden;
    perspective: 340px;
    perspective-origin: 50% 56%;
  }

  [data-bg='grid'] .grid-bg { display: block; }

  .grid-bg::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 56%;
    height: 180px;
    transform: translateY(-50%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(110, 231, 255, 0.16), transparent 70%);
  }

  .grid-plane {
    position: absolute;
    left: -75%;
    right: -75%;
    top: 56%;
    height: 120%;
    transform-origin: 50% 0;
    transform: rotateX(76deg);
    background:
      linear-gradient(to right, rgba(110, 231, 255, 0.4) 1px, transparent 1px) 50% 0 / 60px 60px,
      linear-gradient(to bottom, rgba(110, 231, 255, 0.4) 1px, transparent 1px) 0 0 / 60px 60px;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30%);
    mask-image: linear-gradient(to bottom, transparent, #000 30%);
    animation: grid-scroll 1.8s linear infinite;
  }

  @keyframes grid-scroll {
    to { background-position: 50% 60px, 0 60px; }
  }

  [data-bg='grid'] .hero::after { height: 16%; }

  @media (prefers-reduced-motion: reduce) {
    .grid-plane { animation: none; }
  }

  /* Alt kenarda zemine doğru yumuşak geçiş */
  .hero::after {
    content: '';
    position: absolute;
    inset: auto 0 0 0;
    height: 38%;
    background: linear-gradient(transparent, var(--bg));
    pointer-events: none;
  }

  .hero-word {
    position: relative;
    z-index: 1;
    flex: 1;
    min-height: 0;
    font-family: var(--mono);
  }

  .hero-foot {
    position: relative;
    z-index: 1;
    padding: 0 24px 56px;
    text-align: center;
  }

  .hero-foot p {
    max-width: 30em;
    margin: 0 auto 28px;
    font-size: clamp(16px, 2.2vw, 20px);
    color: #b4bac3;
  }

  /* Card Nav — React Bits (reactbits.dev) bileşeninden uyarlandı; yukarı doğru açılır */
  .card-nav-container {
    position: relative;
    width: min(100%, 640px);
    height: 60px;
    margin: 0 auto;
    text-align: left;
  }

  .card-nav {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 60px;
    overflow: hidden;
    background: rgba(15, 17, 20, 0.92);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid #262b32;
    border-radius: 0.75rem;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    will-change: height;
  }

  .card-nav-top {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    width: 100%;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 1.1rem;
    background: none;
    border: 0;
    color: var(--fg);
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
  }

  .card-nav-top:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: -4px;
    border-radius: 0.75rem;
  }

  .hamburger-menu {
    position: absolute;
    left: 1.1rem;
    top: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--accent);
  }

  .hamburger-line {
    width: 26px;
    height: 2px;
    background-color: currentColor;
    transition: transform 0.25s ease, opacity 0.2s ease;
    transform-origin: 50% 50%;
  }

  .card-nav-top:hover .hamburger-line { opacity: 0.75; }

  .card-nav-top.open .hamburger-line:first-child { transform: translateY(4px) rotate(45deg); }
  .card-nav-top.open .hamburger-line:last-child { transform: translateY(-4px) rotate(-45deg); }

  .card-nav-content {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 60px;
    z-index: 1;
    padding: 0.5rem 0.5rem 0;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    visibility: hidden;
    pointer-events: none;
  }

  .card-nav.open .card-nav-content {
    visibility: visible;
    pointer-events: auto;
  }

  .nav-card {
    height: 100%;
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 14px;
    border-radius: calc(0.75rem - 0.2rem);
    background: #171c22;
  }

  .nav-card:nth-child(2) { background: #1b232b; }
  .nav-card:nth-child(3) { background: #1f2a34; }

  .nav-card-label {
    font-size: 20px;
    letter-spacing: -0.3px;
    color: var(--fg);
  }

  .nav-card-links {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .nav-card-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--accent);
    overflow-wrap: anywhere;
    transition: opacity 0.3s ease;
  }

  a.nav-card-link:hover { opacity: 0.75; }

  .nav-card-link svg { flex: none; }

  /* E-posta adresi tek satıra sığsın diye ortadaki kart daha geniş */
  @media (min-width: 769px) {
    .nav-card:nth-child(2) { flex-grow: 1.7; }
  }

  @media (max-width: 768px) {
    .card-nav-content {
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
    }

    .nav-card {
      height: auto;
      min-height: 60px;
      flex: 1 1 auto;
    }

    .nav-card-label { font-size: 18px; }
  }

  /* TechText */
  .tech-text {
    position: relative;
    width: 100%;
    height: 100%;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
  }

  .tech-text-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  @media (max-width: 720px) {
    .hero-foot { padding-bottom: 32px; }
  }

<script>
// Arka plan seçimi: ?bg=grid (varsayılan), ?bg=particles veya ?bg=slats
window.IQ_BG = new URLSearchParams(location.search).get('bg') || 'grid';
document.documentElement.dataset.bg = window.IQ_BG;

// TechText — React Bits (reactbits.dev) bileşeninin framework'süz uyarlaması.
const LABEL_FONT = '10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
const FALLOFF_STEPS = 8;
const SPRING = 320;
const DAMPING = 22;

const approach = (current, target, dt, seconds) => current + (target - current) * (1 - Math.exp(-dt / seconds));

const hexToRgb = hex => {
  let h = String(hex || '').replace('#', '');
  if (h.length === 3) h = h.replace(/./g, c => c + c);
  const n = parseInt(h.slice(0, 6), 16);
  return Number.isNaN(n) ? [255, 255, 255] : [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};

const rgba = (hex, alpha) => {
  const [r, g, b] = hexToRgb(hex);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
};

const noise = (...values) => {
  let h = 2166136261;
  for (const value of values) {
    h = Math.imul(h ^ (value | 0), 16777619);
    h ^= h >>> 13;
    h = Math.imul(h, 0x5bd1e995);
    h ^= h >>> 15;
  }
  return (h >>> 0) / 4294967296;
};

const signed = value => (value > 0 ? `+${value}` : value < 0 ? `−${-value}` : '0');

const TECH_TEXT_DEFAULTS = {
  text: 'React Bits',
  fontFamily: '',
  fontWeight: 600,
  fontSize: 150,
  letterSpacing: -0.05,
  color: '#ffffff',
  accentColor: '#ffffff',
  reach: 200,
  softness: 0.7,
  dashLength: 4,
  dashGap: 2,
  strokeWidth: 1.5,
  lineStyle: 'dashed',
  reveal: 'letter',
  specks: 15,
  selection: true,
  labels: true,
  draggable: true,
  sweep: true,
  speed: 1
};

function mountTechText(host, options) {
  const s0 = { ...TECH_TEXT_DEFAULTS, ...options };
  const container = document.createElement('div');
  container.className = 'tech-text';
  const canvas = document.createElement('canvas');
  canvas.className = 'tech-text-canvas';
  container.appendChild(canvas);
  host.appendChild(container);

  const ctx = canvas.getContext('2d');
  const scratch = document.createElement('canvas');
  const scratchCtx = scratch.getContext('2d');
  if (!ctx || !scratchCtx) return;

  const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  let width = 1;
  let height = 1;
  let dpr = 1;
  let raf = 0;
  let last = performance.now();
  let visible = true;
  let layoutKey = '';
  let requestedFont = '';
  let word = null;
  let glyphs = [];
  let presence = 0;
  let clock = 0;
  let pulse = 0;
  let placed = false;
  let dragging = -1;
  const pointer = { x: 0, y: 0, inside: false };
  const grab = { x: 0, y: 0 };
  const lens = { x: 0, y: 0 };
  const frame = { x1: 0, y1: 0, x2: 0, y2: 0, alpha: 0, index: -1 };

  const refreshFonts = () => {
    layoutKey = '';
    wake();
  };

  const family = s => s.fontFamily || getComputedStyle(container).fontFamily || 'sans-serif';
  const fontFor = (s, size) => `${s.fontWeight} ${size}px ${family(s)}`;

  const setFont = (target, s, size) => {
    target.font = fontFor(s, size);
    if ('letterSpacing' in target) target.letterSpacing = `${s.letterSpacing * size}px`;
    target.textAlign = 'left';
    target.textBaseline = 'alphabetic';
  };

  const sprite = (s, view, glyph, stroke) => {
    const pad = Math.ceil(s.strokeWidth * 2 + 4);
    const left = glyph.box.x1 - pad;
    const top = glyph.box.y1 - pad;
    const w = glyph.box.x2 - glyph.box.x1 + pad * 2;
    const h = glyph.box.y2 - glyph.box.y1 + pad * 2;
    const image = document.createElement('canvas');
    image.width = Math.max(1, Math.ceil(w * dpr));
    image.height = Math.max(1, Math.ceil(h * dpr));
    const c = image.getContext('2d');
    if (!c) return { image, left, top };
    c.setTransform(dpr, 0, 0, dpr, -left * dpr, -top * dpr);
    setFont(c, s, view.size);
    if (stroke) {
      c.lineJoin = 'round';
      c.lineWidth = s.strokeWidth * 2;
      c.lineCap = 'butt';
      c.strokeStyle = s.color;
      if (s.lineStyle !== 'solid') c.setLineDash([Math.max(1, s.dashLength), Math.max(1, s.dashGap)]);
      c.strokeText(glyph.char, glyph.x, view.baseline);
      c.setLineDash([]);
      c.globalCompositeOperation = 'destination-out';
      c.fillStyle = '#000000';
      c.fillText(glyph.char, glyph.x, view.baseline);
      c.globalCompositeOperation = 'source-over';
    } else {
      c.fillStyle = s.color;
      c.fillText(glyph.char, glyph.x, view.baseline);
    }
    return { image, left, top };
  };

  const ensureLayout = s => {
    const key = [
      s.text,
      family(s),
      s.fontWeight,
      s.fontSize,
      s.letterSpacing,
      s.color,
      s.dashLength,
      s.dashGap,
      s.strokeWidth,
      s.lineStyle,
      width,
      height,
      dpr
    ].join('|');
    if (key === layoutKey && word) return word;
    layoutKey = key;
    const wanted = fontFor(s, 64);
    if (document.fonts && wanted !== requestedFont) {
      requestedFont = wanted;
      document.fonts.load(wanted, s.text).then(refreshFonts, refreshFonts);
    }

    const probe = scratchCtx;
    setFont(probe, s, s.fontSize);
    let m = probe.measureText(s.text);
    const fit = Math.min(
      1,
      (width * 0.9) / Math.max(m.actualBoundingBoxLeft + m.actualBoundingBoxRight, 1),
      (height * 0.66) / Math.max(m.actualBoundingBoxAscent + m.actualBoundingBoxDescent, 1)
    );
    const size = s.fontSize * fit;
    setFont(probe, s, size);
    m = probe.measureText(s.text);
    const inkWidth = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
    const inkHeight = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
    const x = (width - inkWidth) / 2 + m.actualBoundingBoxLeft;
    const baseline = (height - inkHeight) / 2 + m.actualBoundingBoxAscent;
    const next = {
      size,
      baseline,
      left: x - m.actualBoundingBoxLeft,
      right: x + m.actualBoundingBoxRight,
      top: baseline - m.actualBoundingBoxAscent,
      bottom: baseline + m.actualBoundingBoxDescent
    };
    word = next;

    const chars = Array.from(s.text);
    const previous = glyphs;
    glyphs = [];
    let prefix = '';
    chars.forEach((char, i) => {
      prefix += char;
      const own = probe.measureText(char);
      const gx = x + probe.measureText(prefix).width - own.width;
      if (!char.trim()) return;
      const base = {
        char,
        x: gx,
        box: {
          x1: gx - own.actualBoundingBoxLeft,
          y1: baseline - own.actualBoundingBoxAscent,
          x2: gx + own.actualBoundingBoxRight,
          y2: baseline + own.actualBoundingBoxDescent
        }
      };
      const kept = previous[glyphs.length];
      glyphs.push({
        ...base,
        offset: kept?.char === char ? kept.offset : { x: 0, y: 0 },
        velocity: { x: 0, y: 0 },
        outline: 0,
        index: i,
        fill: sprite(s, next, base, false),
        dashes: sprite(s, next, base, true)
      });
    });
    dragging = -1;
    frame.index = -1;
    return next;
  };

  const glyphAt = (x, y) => {
    if (!word || y < word.top - 24 || y > word.bottom + 24) return -1;
    let best = -1;
    let bestDistance = Infinity;
    glyphs.forEach((glyph, i) => {
      const x1 = glyph.box.x1 + glyph.offset.x;
      const x2 = glyph.box.x2 + glyph.offset.x;
      const d = x < x1 ? x1 - x : x > x2 ? x - x2 : 0;
      if (d < bestDistance) {
        bestDistance = d;
        best = i;
      }
    });
    return bestDistance < 28 ? best : -1;
  };

  const falloff = (target, cx, cy, radius, strength, softness) => {
    const inner = Math.min(1, Math.max(0, 1 - softness));
    const gradient = target.createRadialGradient(cx, cy, 0, cx, cy, radius);
    gradient.addColorStop(0, `rgba(0, 0, 0, ${strength})`);
    if (inner > 0.995) {
      gradient.addColorStop(0.995, `rgba(0, 0, 0, ${strength})`);
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      return gradient;
    }
    for (let i = 0; i <= FALLOFF_STEPS; i++) {
      const t = i / FALLOFF_STEPS;
      const eased = t * t * (3 - 2 * t);
      gradient.addColorStop(inner + (1 - inner) * t, `rgba(0, 0, 0, ${strength * (1 - eased)})`);
    }
    return gradient;
  };

  const blit = (target, art, dx, dy, originX, originY) => {
    target.drawImage(
      art.image,
      Math.round((art.left + dx) * dpr - originX),
      Math.round((art.top + dy) * dpr - originY)
    );
  };

  const drawReveal = s => {
    const radius = s.reach * dpr;
    const cx = lens.x * dpr;
    const cy = lens.y * dpr;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = falloff(ctx, cx, cy, radius, presence, s.softness);
    ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
    ctx.globalCompositeOperation = 'source-over';

    const x0 = Math.max(0, Math.floor(cx - radius));
    const y0 = Math.max(0, Math.floor(cy - radius));
    const x1 = Math.min(canvas.width, Math.ceil(cx + radius));
    const y1 = Math.min(canvas.height, Math.ceil(cy + radius));
    if (x1 <= x0 || y1 <= y0) return;
    const w = x1 - x0;
    const h = y1 - y0;
    if (scratch.width < w || scratch.height < h) {
      scratch.width = Math.max(scratch.width, w);
      scratch.height = Math.max(scratch.height, h);
    }
    scratchCtx.setTransform(1, 0, 0, 1, 0, 0);
    scratchCtx.globalCompositeOperation = 'source-over';
    scratchCtx.clearRect(0, 0, w, h);
    for (const glyph of glyphs) blit(scratchCtx, glyph.dashes, glyph.offset.x, glyph.offset.y, x0, y0);
    scratchCtx.globalCompositeOperation = 'destination-in';
    scratchCtx.fillStyle = falloff(scratchCtx, cx - x0, cy - y0, radius, 1, s.softness);
    scratchCtx.fillRect(0, 0, w, h);
    scratchCtx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = presence;
    ctx.drawImage(scratch, 0, 0, w, h, x0, y0, w, h);
    ctx.globalAlpha = 1;
  };

  const crisp = value => (Math.round(value * dpr) + 0.5) / dpr;

  const perimeterPoint = (distance, w, h) => {
    let d = ((distance % (2 * (w + h))) + 2 * (w + h)) % (2 * (w + h));
    if (d < w) return [frame.x1 + d, frame.y1, 0, -1];
    d -= w;
    if (d < h) return [frame.x2, frame.y1 + d, 1, 0];
    d -= h;
    if (d < w) return [frame.x2 - d, frame.y2, 0, 1];
    d -= w;
    return [frame.x1, frame.y2 - d, -1, 0];
  };

  const drawSpecks = (s, a) => {
    const w = frame.x2 - frame.x1;
    const h = frame.y2 - frame.y1;
    if (w < 2 || h < 2) return;
    const perimeter = 2 * (w + h);
    const seed = frame.index + 1;
    const grid = 3;

    for (let k = 0; k < s.specks; k++) {
      const period = 0.5 + noise(seed, k, 11) * 1.2;
      const t = pulse / period + noise(seed, k, 17);
      const cycle = Math.floor(t);
      const life = t - cycle;
      if (life > 0.7) continue;
      const [px, py, nx, ny] = perimeterPoint(noise(seed, k, cycle) * perimeter, w, h);
      const pick = noise(seed, k, cycle, 2);
      const size = pick < 0.46 ? 2 : pick < 0.7 ? 3 : pick < 0.84 ? 5 : pick < 0.94 ? 8 : 11;
      const large = size >= 8;
      const out = (large ? 9 : 4) + Math.floor(noise(seed, k, cycle, 1) * 5) * grid;
      const x = frame.x1 + Math.round((px + nx * out - frame.x1) / grid) * grid;
      const y = frame.y1 + Math.round((py + ny * out - frame.y1) / grid) * grid;
      const tone = noise(seed, k, cycle, 3);
      const blink = life < 0.06 || (life > 0.32 && life < 0.36) ? 0.35 : 1;
      const alpha = a * (large ? 0.3 + 0.4 * tone : 0.3 + 0.6 * tone) * blink;
      const left = Math.round(x - size / 2);
      const top = Math.round(y - size / 2);
      if (tone < 0.26 || (large && tone < 0.78)) {
        ctx.strokeStyle = rgba(s.accentColor, alpha);
        ctx.strokeRect(left + 0.5, top + 0.5, size, size);
        if (large && tone > 0.5) {
          ctx.fillStyle = rgba(s.accentColor, alpha);
          ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, 2, 2);
        }
      } else {
        ctx.fillStyle = rgba(s.accentColor, alpha);
        ctx.fillRect(left, top, size, size);
      }
    }

    for (let j = 0; j < 2; j++) {
      const head = (pulse * 0.42 * s.speed + j * 0.5) * perimeter;
      for (let i = 0; i < 4; i++) {
        const [x, y] = perimeterPoint(head - i * 6, w, h);
        const size = i === 0 ? 3 : 2;
        ctx.fillStyle = rgba(s.accentColor, a * [0.95, 0.55, 0.32, 0.16][i]);
        ctx.fillRect(Math.round(x - size / 2), Math.round(y - size / 2), size, size);
      }
    }
  };

  const drawFrame = s => {
    const glyph = glyphs[frame.index];
    if (!glyph || frame.alpha < 0.01) return;
    const a = frame.alpha;
    const x1 = crisp(frame.x1);
    const y1 = crisp(frame.y1);
    const x2 = crisp(frame.x2);
    const y2 = crisp(frame.y2);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const moved = Math.hypot(glyph.offset.x, glyph.offset.y);
    if (moved > 1) {
      const hx = (glyph.box.x1 + glyph.box.x2) / 2;
      const hy = (glyph.box.y1 + glyph.box.y2) / 2;
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.lineTo(hx + glyph.offset.x, hy + glyph.offset.y);
      ctx.setLineDash([3, 4]);
      ctx.lineWidth = 1;
      ctx.strokeStyle = rgba(s.accentColor, 0.45 * a);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.rect(Math.round(hx) - 2, Math.round(hy) - 2, 4, 4);
      ctx.fillStyle = rgba(s.accentColor, 0.7 * a);
      ctx.fill();
    }

    ctx.beginPath();
    ctx.rect(x1, y1, x2 - x1, y2 - y1);
    ctx.lineWidth = 1;
    ctx.strokeStyle = rgba(s.accentColor, 0.5 * a);
    ctx.stroke();

    ctx.beginPath();
    for (const [cx, cy] of [
      [x1, y1],
      [x2, y1],
      [x2, y2],
      [x1, y2]
    ]) {
      ctx.rect(Math.round(cx) - 2, Math.round(cy) - 2, 5, 5);
    }
    ctx.fillStyle = rgba(s.accentColor, 0.95 * a);
    ctx.fill();

    if (s.specks > 0) {
      ctx.lineWidth = 1;
      drawSpecks(s, a);
    }

    if (!s.labels) return;
    ctx.font = LABEL_FONT;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = rgba(s.accentColor, 0.62 * a);
    const label =
      moved > 1
        ? `${signed(Math.round(glyph.offset.x))}, ${signed(Math.round(-glyph.offset.y))}`
        : `${glyph.char}  ${Math.round(glyph.box.x2 - glyph.box.x1)} × ${Math.round(glyph.box.y2 - glyph.box.y1)}`;
    ctx.fillText(label, Math.round(frame.x1), Math.round(frame.y1) - 7);
  };

  const tick = now => {
    raf = 0;
    const s = s0;
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
    last = now;
    const view = ensureLayout(s);

    const sweeping = s.sweep && !reducedMotion && !pointer.inside && dragging < 0;
    if (sweeping) clock += dt * s.speed;
    pulse += dt;
    let targetX = pointer.x;
    let targetY = pointer.y;
    if (sweeping) {
      targetX = view.left + (view.right - view.left) * (0.5 - 0.5 * Math.cos(clock * 0.45));
      targetY = view.top + (view.bottom - view.top) * (0.45 + 0.1 * Math.sin(clock * 0.8));
    }
    const active = pointer.inside || sweeping || dragging >= 0;
    if (active && !placed) {
      lens.x = targetX;
      lens.y = targetY;
    }
    if (active) {
      const lag = pointer.inside ? 0.05 : 0.22;
      lens.x = approach(lens.x, targetX, dt, lag);
      lens.y = approach(lens.y, targetY, dt, lag);
    }
    placed = active;
    presence = approach(presence, s.reveal === 'area' && active && dragging < 0 ? 1 : 0, dt, 0.16);

    let moving = false;
    glyphs.forEach((glyph, i) => {
      if (i === dragging) {
        glyph.offset.x = approach(glyph.offset.x, pointer.x - grab.x, dt, 0.03);
        glyph.offset.y = approach(glyph.offset.y, pointer.y - grab.y, dt, 0.03);
        glyph.velocity.x = 0;
        glyph.velocity.y = 0;
        moving = true;
        return;
      }
      const { offset, velocity } = glyph;
      if (Math.abs(offset.x) < 0.05 && Math.abs(offset.y) < 0.05 && Math.hypot(velocity.x, velocity.y) < 0.5) {
        offset.x = 0;
        offset.y = 0;
        velocity.x = 0;
        velocity.y = 0;
        return;
      }
      velocity.x += (-SPRING * offset.x - DAMPING * velocity.x) * dt;
      velocity.y += (-SPRING * offset.y - DAMPING * velocity.y) * dt;
      offset.x += velocity.x * dt;
      offset.y += velocity.y * dt;
      moving = true;
    });

    const focus = dragging >= 0 ? dragging : active ? glyphAt(lens.x, lens.y) : -1;
    if (focus >= 0 && s.selection) {
      const glyph = glyphs[focus];
      const bx1 = glyph.box.x1 + glyph.offset.x - 6;
      const by1 = glyph.box.y1 + glyph.offset.y - 6;
      const bx2 = glyph.box.x2 + glyph.offset.x + 6;
      const by2 = glyph.box.y2 + glyph.offset.y + 6;
      if (frame.index < 0 || frame.alpha < 0.02) {
        frame.x1 = bx1;
        frame.y1 = by1;
        frame.x2 = bx2;
        frame.y2 = by2;
      }
      const glide = focus === dragging ? 0.02 : 0.08;
      frame.x1 = approach(frame.x1, bx1, dt, glide);
      frame.y1 = approach(frame.y1, by1, dt, glide);
      frame.x2 = approach(frame.x2, bx2, dt, glide);
      frame.y2 = approach(frame.y2, by2, dt, glide);
      frame.index = focus;
    }
    frame.alpha = approach(frame.alpha, focus >= 0 && s.selection ? 1 : 0, dt, 0.1);

    glyphs.forEach((glyph, i) => {
      const target = s.reveal === 'letter' && i === focus && i !== dragging ? 1 : 0;
      glyph.outline = approach(glyph.outline, target, dt, 0.09);
      if (Math.abs(glyph.outline - target) > 0.002) moving = true;
      else glyph.outline = target;
    });

    if (s.draggable) container.style.cursor = dragging >= 0 ? 'grabbing' : focus >= 0 && pointer.inside ? 'grab' : '';

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const glyph of glyphs) {
      const moved = Math.hypot(glyph.offset.x, glyph.offset.y);
      if (moved > 1) {
        ctx.globalAlpha = Math.min(1, moved / 24) * 0.55;
        blit(ctx, glyph.dashes, 0, 0, 0, 0);
        ctx.globalAlpha = 1;
      }
    }
    for (const glyph of glyphs) {
      if (glyph.outline < 0.999) {
        ctx.globalAlpha = 1 - glyph.outline;
        blit(ctx, glyph.fill, glyph.offset.x, glyph.offset.y, 0, 0);
      }
      if (glyph.outline > 0.001) {
        ctx.globalAlpha = glyph.outline;
        blit(ctx, glyph.dashes, glyph.offset.x, glyph.offset.y, 0, 0);
      }
      ctx.globalAlpha = 1;
    }
    if (presence > 0.001) drawReveal(s);
    drawFrame(s);

    const settling =
      moving ||
      Math.abs(presence - (s.reveal === 'area' && active && dragging < 0 ? 1 : 0)) > 0.002 ||
      (frame.alpha > 0.01 && frame.alpha < 0.99);
    if ((active || settling) && visible) raf = requestAnimationFrame(tick);
  };

  function wake() {
    if (raf || !visible) return;
    last = performance.now();
    raf = requestAnimationFrame(tick);
  }

  const resize = () => {
    width = Math.max(1, container.clientWidth);
    height = Math.max(1, container.clientHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    layoutKey = '';
    wake();
  };

  const locate = e => {
    const rect = container.getBoundingClientRect();
    pointer.x = e.clientX - rect.left;
    pointer.y = e.clientY - rect.top;
  };
  const onMove = e => {
    locate(e);
    pointer.inside = true;
    wake();
  };
  const onLeave = () => {
    if (dragging >= 0) return;
    pointer.inside = false;
    wake();
  };
  const onDown = e => {
    locate(e);
    pointer.inside = true;
    if (s0.draggable && (e.pointerType !== 'mouse' || e.button === 0)) {
      const index = glyphAt(pointer.x, pointer.y);
      if (index >= 0) {
        dragging = index;
        grab.x = pointer.x - glyphs[index].offset.x;
        grab.y = pointer.y - glyphs[index].offset.y;
        container.setPointerCapture?.(e.pointerId);
      }
    }
    wake();
  };
  const onUp = e => {
    if (dragging >= 0) {
      dragging = -1;
      container.releasePointerCapture?.(e.pointerId);
      const rect = container.getBoundingClientRect();
      pointer.inside =
        e.pointerType === 'mouse' &&
        e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
    } else if (e.pointerType !== 'mouse') {
      pointer.inside = false;
    }
    wake();
  };

  container.addEventListener('pointermove', onMove, { passive: true });
  container.addEventListener('pointerenter', onMove, { passive: true });
  container.addEventListener('pointerdown', onDown, { passive: true });
  container.addEventListener('pointerup', onUp, { passive: true });
  container.addEventListener('pointercancel', onUp, { passive: true });
  container.addEventListener('pointerleave', onLeave, { passive: true });

  new ResizeObserver(resize).observe(container);
  new IntersectionObserver(([entry]) => {
    visible = entry.isIntersecting;
    wake();
  }).observe(container);
  if (document.fonts) document.fonts.ready.then(refreshFonts, refreshFonts);

  resize();
}

mountTechText(document.getElementById('wordmark'), {
  text: '<iQ> Soft',
  fontFamily: "'Chillax', system-ui, sans-serif",
  fontWeight: 600,
  fontSize: 170,
  reveal: 'letter',
  dashLength: 4,
  dashGap: 2,
  specks: 15,
  color: '#f2f3f5',
  accentColor: '#6ee7ff'
});

// Card Nav: çubuğa tıklanınca kartlar yukarı doğru açılır (GSAP, circ.out)
const cardNav = document.getElementById('iletisim');
const cardNavContent = document.getElementById('iletisim-kartlar');
const cardNavToggle = document.getElementById('iletisim-ac');
const cardNavCards = [...cardNav.querySelectorAll('.nav-card')];
const CARD_NAV_BAR = 60;
const CARD_NAV_EASE = 'circ.out';
const cardNavStill = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let cardNavTimeline = null;
let cardNavOpen = false;

const cardNavHeight = () => {
  if (!window.matchMedia('(max-width: 768px)').matches) return 210;
  // Mobilde kartlar alt alta dizilir; yüksekliği içerikten ölç
  const { position, height } = cardNavContent.style;
  cardNavContent.style.position = 'static';
  cardNavContent.style.height = 'auto';
  const contentHeight = cardNavContent.scrollHeight;
  cardNavContent.style.position = position;
  cardNavContent.style.height = height;
  return CARD_NAV_BAR + contentHeight;
};

const createCardNavTimeline = () => {
  if (!window.gsap) return null;
  const duration = cardNavStill ? 0 : 0.4;
  gsap.set(cardNav, { height: CARD_NAV_BAR });
  gsap.set(cardNavCards, { y: 50, opacity: 0 });
  const tl = gsap.timeline({ paused: true });
  tl.to(cardNav, { height: cardNavHeight, duration, ease: CARD_NAV_EASE });
  tl.to(
    cardNavCards,
    { y: 0, opacity: 1, duration, ease: CARD_NAV_EASE, stagger: cardNavStill ? 0 : 0.08 },
    cardNavStill ? 0 : '-=0.1'
  );
  return tl;
};

const setCardNav = open => {
  if (open === cardNavOpen) return;
  cardNavOpen = open;
  cardNavToggle.classList.toggle('open', open);
  cardNavToggle.setAttribute('aria-expanded', String(open));
  cardNavContent.setAttribute('aria-hidden', String(!open));
  cardNavContent.inert = !open;
  const tl = cardNavTimeline;
  if (!tl) {
    // GSAP yüklenemediyse animasyonsuz aç/kapat
    cardNav.classList.toggle('open', open);
    cardNav.style.height = `${open ? cardNavHeight() : CARD_NAV_BAR}px`;
    return;
  }
  if (open) {
    cardNav.classList.add('open');
    tl.eventCallback('onReverseComplete', null);
    tl.play(0);
  } else {
    tl.eventCallback('onReverseComplete', () => cardNav.classList.remove('open'));
    tl.reverse();
  }
};

cardNavTimeline = createCardNavTimeline();

cardNavToggle.addEventListener('click', () => setCardNav(!cardNavOpen));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && cardNavOpen) {
    setCardNav(false);
    cardNavToggle.focus();
  }
});
document.addEventListener('pointerdown', e => {
  if (cardNavOpen && !cardNav.contains(e.target)) setCardNav(false);
});
window.addEventListener('resize', () => {
  if (!cardNavTimeline) {
    if (cardNavOpen) cardNav.style.height = `${cardNavHeight()}px`;
    return;
  }
  cardNavTimeline.kill();
  cardNavTimeline = createCardNavTimeline();
  if (cardNavOpen) cardNavTimeline.progress(1);
});
</script>

<script>
// Particles — React Bits (reactbits.dev) bileşeninin framework'süz uyarlaması.
(() => {
const SHAPES = { circle: 0, square: 1, ring: 2, sparkle: 3 };
const EFFECTS = { parallax: 0, repel: 1, attract: 2 };
const DRIFTS = { none: 0, up: 1, down: 2, forward: 3 };
const MAX_COUNT = 20000;
const MAX_LINKED = 900;
const MAX_LINES = 9000;
const MAX_BURSTS = 4;
const DEPTH = 10;
const FOCAL = 1 / Math.tan((7.5 * Math.PI) / 180);
const NEAR = 0.1;
const FAR = 100;
const INTRO_SECONDS = 1.8;
const BURST_SECONDS = 1.5;
const BURST_SPEED = 520;
const BURST_WIDTH = 46;

const PARTICLE_VERTEX = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aCorner;
layout(location = 1) in vec3 aPosition;
layout(location = 2) in vec4 aRandom;
layout(location = 3) in vec3 aColor;
uniform mat3 uRotation;
uniform vec3 uOffset;
uniform float uSpread;
uniform float uTime;
uniform float uCamera;
uniform float uAspect;
uniform vec2 uView;
uniform float uRatio;
uniform float uSize;
uniform float uRandomness;
uniform float uBlur;
uniform float uFocus;
uniform float uGlow;
uniform float uTwinkle;
uniform int uShape;
uniform int uDrift;
uniform float uTravel;
uniform vec4 uPointer;
uniform int uEffect;
uniform float uStrength;
uniform vec4 uBursts[${MAX_BURSTS}];
uniform int uBurstCount;
uniform float uReveal;
out vec2 vLocal;
out float vRadius;
out float vBlur;
out float vAlpha;
out float vHalo;
out float vSeed;
out vec3 vColor;

vec3 bob(vec4 r, float t) {
  return vec3(
    sin(t * r.z + 6.28 * r.w) * mix(0.1, 1.5, r.x),
    sin(t * r.y + 6.28 * r.x) * mix(0.1, 1.5, r.w),
    sin(t * r.w + 6.28 * r.y) * mix(0.1, 1.5, r.z)
  );
}

void main() {
  vec3 pos = aPosition * uSpread;
  pos.z *= ${DEPTH.toFixed(1)};
  vec3 wobble = bob(aRandom, uTime);
  vec3 world = uRotation * pos + uOffset + wobble;
  float edge = 1.0;
  if (uDrift == 1 || uDrift == 2) {
    float span = uSpread * 2.0 + 3.0;
    float k = mod(aRandom.w * span + uOffset.y + wobble.y + (uDrift == 1 ? uTravel : -uTravel), span);
    world.y = k - span * 0.5;
    edge = smoothstep(0.0, span * 0.12, k) * smoothstep(span, span * 0.88, k);
  } else if (uDrift == 3) {
    float span = uSpread * ${DEPTH.toFixed(1)} * 2.0 + 3.0;
    float k = mod(aRandom.y * span + uOffset.z + wobble.z + uTravel, span);
    world.z = k - span * 0.5;
    edge = smoothstep(0.0, span * 0.1, k);
  }
  vec3 view = world - vec3(0.0, 0.0, uCamera);
  float dist = length(view);
  float ahead = -view.z;
  if (ahead < ${NEAR.toFixed(2)} || ahead > ${FAR.toFixed(1)}) {
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    return;
  }
  edge *= smoothstep(1.0, 4.0, ahead);
  vec2 ndc = vec2(view.x * ${FOCAL.toFixed(6)} / uAspect, view.y * ${FOCAL.toFixed(6)}) / ahead;
  vec2 screen = (ndc * 0.5 + 0.5) * uView;

  vec2 shift = vec2(0.0);
  float flash = 0.0;
  if (uEffect != 0 && uPointer.z > 0.001) {
    vec2 delta = screen - uPointer.xy;
    float reach = length(delta);
    float falloff = exp(-dot(delta, delta) / (uPointer.w * uPointer.w));
    vec2 away = reach > 0.001 ? delta / reach : vec2(0.0);
    shift += (uEffect == 1 ? away * uPointer.w * 0.5 : -delta * 0.6) * falloff * uStrength * uPointer.z;
  }
  for (int i = 0; i < ${MAX_BURSTS}; i++) {
    if (i >= uBurstCount) break;
    vec4 burst = uBursts[i];
    vec2 delta = screen - burst.xy;
    float reach = length(delta);
    float wave = exp(-pow((reach - burst.z * ${BURST_SPEED.toFixed(1)}) / ${BURST_WIDTH.toFixed(1)}, 2.0));
    vec2 away = reach > 0.001 ? delta / reach : vec2(0.0);
    float fade = (1.0 - burst.z) * (1.0 - burst.z) * burst.w;
    shift += away * wave * fade * 56.0 * smoothstep(0.0, 30.0, reach);
    flash += wave * fade;
  }
  screen += shift;

  float diameter = (uRandomness <= 0.0 ? uSize : uSize * (1.0 + uRandomness * (aRandom.x - 0.5)) / dist) * (1.0 + min(flash, 1.0) * 0.6);
  float device = diameter * uRatio;
  float radius = max(diameter, 1.0 / uRatio) * 0.5;
  float coverage = min(1.0, device * device);
  float blur = uBlur * max(uFocus - dist, 0.0) / max(dist, 1.0);
  float halo = uGlow > 0.0 ? radius * 2.5 + 2.0 : 0.0;
  float extent = radius * (uShape == 3 ? 1.6 : 1.0) + blur + halo + 1.5;

  float twinkle = 1.0 - uTwinkle * 0.6 * (0.5 + 0.5 * sin(uTime * (6.0 + aRandom.y * 14.0) + aRandom.w * 40.0));
  float far = smoothstep(${FAR.toFixed(1)}, ${(FAR * 0.9).toFixed(1)}, ahead);
  float focus = radius / (radius + blur);
  float reveal = clamp(uReveal * 1.6 - aRandom.z * 0.6, 0.0, 1.0);

  vLocal = aCorner * extent;
  vRadius = radius;
  vBlur = blur;
  vHalo = halo;
  vSeed = aRandom.y;
  vAlpha = min(1.0, coverage * twinkle * (1.0 + flash * 1.4)) * far * edge * max(focus, 0.35) * reveal * reveal;
  vColor = aColor;
  gl_Position = vec4((screen + aCorner * extent) / uView * 2.0 - 1.0, 0.0, 1.0);
}`;

const PARTICLE_FRAGMENT = `#version 300 es
precision highp float;
precision highp int;
uniform int uShape;
uniform float uGlow;
uniform float uRatio;
uniform float uTime;
uniform float uSoft;
uniform float uShimmer;
uniform float uOpacity;
in vec2 vLocal;
in float vRadius;
in float vBlur;
in float vAlpha;
in float vHalo;
in float vSeed;
in vec3 vColor;
out vec4 outColor;

float ray(vec2 q, float aa) {
  float width = 0.14 * max(0.0, 1.0 - q.x);
  return (1.0 - smoothstep(width - aa, width + aa, q.y)) * step(q.x, 1.0);
}

void main() {
  float soft = vBlur + 0.7 / uRatio + vRadius * uSoft;
  float d = length(vLocal);
  float shape;
  if (uShape == 1) {
    float box = max(abs(vLocal.x), abs(vLocal.y));
    shape = 1.0 - smoothstep(vRadius * 0.86 - soft, vRadius * 0.86 + soft, box);
  } else if (uShape == 2) {
    float edge = max(vRadius * 0.22, 0.6 / uRatio);
    shape = 1.0 - smoothstep(edge - soft, edge + soft, abs(d - vRadius * 0.8));
  } else if (uShape == 3) {
    float reach = vRadius * 1.6;
    vec2 q = abs(vLocal) / max(reach, 0.0001);
    float aa = soft / max(reach, 0.0001);
    shape = max(max(ray(q, aa), ray(q.yx, aa)), 1.0 - smoothstep(vRadius * 0.32 - soft, vRadius * 0.32 + soft, d));
  } else {
    shape = 1.0 - smoothstep(vRadius - soft, vRadius + soft, d);
  }
  float halo = vHalo > 0.0 ? exp(-d / (vHalo * 0.35)) * uGlow * 0.4 : 0.0;
  float alpha = clamp(shape + halo * (1.0 - shape), 0.0, 1.0) * vAlpha * uOpacity * (1.0 - uSoft);
  if (alpha < 0.002) discard;
  vec2 uv = vLocal / max(vRadius * 2.0, 0.0001) + 0.5;
  vec3 color = clamp(vColor + uShimmer * 0.2 * sin(uv.yxx + uTime + vSeed * 6.28), 0.0, 1.0);
  outColor = vec4(color * alpha, alpha);
}`;

const LINE_VERTEX = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aCorner;
layout(location = 1) in vec4 aEnds;
layout(location = 2) in vec4 aTint;
uniform vec2 uView;
uniform float uRatio;
uniform float uWidth;
out float vAcross;
out float vHalf;
out vec4 vTint;

void main() {
  vec2 a = aEnds.xy;
  vec2 b = aEnds.zw;
  vec2 along = b - a;
  float span = max(length(along), 0.0001);
  vec2 normal = vec2(-along.y, along.x) / span;
  float reach = uWidth * 0.5 + 1.0 / uRatio;
  vec2 point = mix(a, b, aCorner.x * 0.5 + 0.5) + normal * aCorner.y * reach;
  vAcross = aCorner.y * reach;
  vHalf = uWidth * 0.5;
  vTint = aTint;
  gl_Position = vec4(point / uView * 2.0 - 1.0, 0.0, 1.0);
}`;

const LINE_FRAGMENT = `#version 300 es
precision highp float;
uniform float uRatio;
uniform float uOpacity;
in float vAcross;
in float vHalf;
in vec4 vTint;
out vec4 outColor;

void main() {
  float edge = 0.6 / uRatio;
  float cover = 1.0 - smoothstep(vHalf - edge, vHalf + edge, abs(vAcross));
  float alpha = cover * vTint.a * uOpacity;
  outColor = vec4(vTint.rgb * alpha, alpha);
}`;

const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

const compile = (gl, type, source) => {
  const shader = gl.createShader(type);
  if (!shader) return null;
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
  gl.deleteShader(shader);
  return null;
};

const link = (gl, vertexSource, fragmentSource) => {
  const vertex = compile(gl, gl.VERTEX_SHADER, vertexSource);
  const fragment = compile(gl, gl.FRAGMENT_SHADER, fragmentSource);
  const program = gl.createProgram();
  if (!vertex || !fragment || !program) return null;
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.linkProgram(program);
  gl.deleteShader(vertex);
  gl.deleteShader(fragment);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    gl.deleteProgram(program);
    return null;
  }
  const uniforms = {};
  const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const info = gl.getActiveUniform(program, i);
    if (info) uniforms[info.name.replace('[0]', '')] = gl.getUniformLocation(program, info.name);
  }
  return { program, uniforms };
};

const seeded = seed => {
  let state = seed >>> 0;
  return () => {
    state = (state + 0x6d2b79f5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);

const wrap = (value, span) => ((value % span) + span) % span;

function mountParticles(container, {
  particleCount = 200,
  particleSpread = 10,
  speed = 0.1,
  particleColors = ['#ffffff'],
  moveParticlesOnHover = true,
  particleHoverFactor = 1,
  alphaParticles = false,
  particleBaseSize = 100,
  sizeRandomness = 1,
  cameraDistance = 20,
  disableRotation = false,
  pixelRatio,
  shape = 'circle',
  glow = 0.5,
  twinkle = 0.3,
  depthOfField = 0,
  connections = false,
  connectionDistance = 110,
  hoverEffect = 'parallax',
  hoverRadius = 140,
  clickBurst = true,
  drift = 'none',
  driftSpeed = 1,
  variation = 0,
  intro = true,
  opacity = 1,
  lightMode = false,
  paused = false
} = {}) {
  const palette = (Array.isArray(particleColors) ? particleColors : [particleColors]).filter(Boolean).map(String);
  const s = {
    count: clamp(Math.round(particleCount), 1, MAX_COUNT),
    spread: Math.max(0.1, particleSpread),
    speed,
    colors: palette.length ? palette : ['#ffffff'],
    mouse: moveParticlesOnHover,
    hoverFactor: Math.max(0, particleHoverFactor),
    soft: alphaParticles,
    size: Math.max(0, particleBaseSize),
    randomness: Math.max(0, sizeRandomness),
    camera: Math.max(1, cameraDistance),
    rotate: !disableRotation,
    dpr: pixelRatio,
    shape: SHAPES[shape] ?? 0,
    glow: Math.max(0, glow),
    twinkle: clamp(twinkle, 0, 1),
    depthOfField: Math.max(0, depthOfField),
    connections,
    connectionDistance: Math.max(10, connectionDistance),
    hoverEffect: EFFECTS[hoverEffect] ?? 0,
    hoverRadius: Math.max(20, hoverRadius),
    clickBurst,
    drift: DRIFTS[drift] ?? 0,
    driftSpeed,
    variation: Math.max(0, Math.round(variation)),
    intro,
    opacity: clamp(opacity, 0, 1),
    lightMode,
    paused
  };

  const canvas = document.createElement('canvas');
  canvas.className = 'particles-canvas';
  canvas.setAttribute('aria-hidden', 'true');
  const gl = canvas.getContext('webgl2', {
    alpha: true,
    premultipliedAlpha: true,
    antialias: false,
    depth: false,
    stencil: false
  });
  if (!gl) return;

  const dots = link(gl, PARTICLE_VERTEX, PARTICLE_FRAGMENT);
  const lines = link(gl, LINE_VERTEX, LINE_FRAGMENT);
  if (!dots || !lines) return;
  container.appendChild(canvas);

  const corners = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, corners);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

  const positionBuffer = gl.createBuffer();
  const randomBuffer = gl.createBuffer();
  const colorBuffer = gl.createBuffer();
  const dotVao = gl.createVertexArray();
  gl.bindVertexArray(dotVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, corners);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const attach = (buffer, location, width) => {
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.enableVertexAttribArray(location);
    gl.vertexAttribPointer(location, width, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(location, 1);
  };
  attach(positionBuffer, 1, 3);
  attach(randomBuffer, 2, 4);
  attach(colorBuffer, 3, 3);

  const lineBuffer = gl.createBuffer();
  const lineData = new Float32Array(MAX_LINES * 8);
  const lineVao = gl.createVertexArray();
  gl.bindVertexArray(lineVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, corners);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, lineBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, lineData.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 0);
  gl.vertexAttribDivisor(1, 1);
  gl.enableVertexAttribArray(2);
  gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16);
  gl.vertexAttribDivisor(2, 1);
  gl.bindVertexArray(null);

  const probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  const reduce = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
  const cache = new Map();
  const parse = value => {
    if (cache.has(value)) return cache.get(value);
    let rgb = [1, 1, 1];
    if (probe) {
      probe.clearRect(0, 0, 1, 1);
      probe.fillStyle = '#ffffff';
      probe.fillStyle = value;
      probe.fillRect(0, 0, 1, 1);
      const [r, g, b] = probe.getImageData(0, 0, 1, 1).data;
      rgb = [r / 255, g / 255, b / 255];
    }
    cache.set(value, rgb);
    return rgb;
  };
  const ink = rgb => {
    const linear = rgb.map(v => Math.pow(v, 2.2));
    const tone = 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
    const depth = Math.min(1, 0.06 / Math.max(tone, 0.0001));
    return linear.map(v => Math.pow(v * depth, 1 / 2.2));
  };

  const view = { width: 1, height: 1, ratio: 1 };
  const pointer = { x: 0, y: 0, sx: 0, sy: 0, nx: 0, ny: 0, inside: false, active: 0 };
  const state = {
    clock: 0,
    spin: 0,
    travel: 0,
    offsetX: 0,
    offsetY: 0,
    reveal: s.intro && !reduce ? 0 : 1
  };
  const bursts = [];
  const packedBursts = new Float32Array(MAX_BURSTS * 4);
  const cloud = {
    key: '',
    count: 0,
    positions: new Float32Array(0),
    randoms: new Float32Array(0),
    colors: new Float32Array(0)
  };
  const screen = {
    x: new Float32Array(0),
    y: new Float32Array(0),
    ahead: new Float32Array(0),
    alpha: new Float32Array(0)
  };
  let raf = 0;
  let last = 0;
  let visible = true;

  const rebuild = s => {
    const key = `${s.count}|${s.variation}|${s.colors.join(',')}|${s.lightMode ? 1 : 0}`;
    if (key === cloud.key) return;
    cloud.key = key;
    const next = seeded(s.variation * 7919 + 1);
    const total = s.count;
    const positions = new Float32Array(total * 3);
    const randoms = new Float32Array(total * 4);
    const tints = new Float32Array(total * 3);
    const swatches = s.colors.map(value => (s.lightMode ? ink(parse(value)) : parse(value)));
    for (let i = 0; i < total; i++) {
      let x;
      let y;
      let z;
      let len;
      do {
        x = next() * 2 - 1;
        y = next() * 2 - 1;
        z = next() * 2 - 1;
        len = x * x + y * y + z * z;
      } while (len > 1 || len === 0);
      const r = Math.cbrt(next());
      positions.set([x * r, y * r, z * r], i * 3);
      randoms.set([next(), next(), next(), next()], i * 4);
      tints.set(swatches[Math.floor(next() * swatches.length)], i * 3);
    }
    cloud.count = total;
    cloud.positions = positions;
    cloud.randoms = randoms;
    cloud.colors = tints;
    const linked = Math.min(total, MAX_LINKED);
    screen.x = new Float32Array(linked);
    screen.y = new Float32Array(linked);
    screen.ahead = new Float32Array(linked);
    screen.alpha = new Float32Array(linked);
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, randomBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, randoms, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, tints, gl.STATIC_DRAW);
  };

  const rotationOf = s => {
    const elapsed = state.clock * 1000;
    const x = s.rotate ? Math.sin(elapsed * 0.0002) * 0.1 : 0;
    const y = s.rotate ? Math.cos(elapsed * 0.0005) * 0.15 : 0;
    const z = s.rotate ? state.spin : 0;
    const [sx, cx, sy, cy, sz, cz] = [Math.sin(x), Math.cos(x), Math.sin(y), Math.cos(y), Math.sin(z), Math.cos(z)];
    return [
      cy * cz + sy * sx * sz,
      cx * sz,
      -sy * cz + cy * sx * sz,
      -cy * sz + sy * sx * cz,
      cx * cz,
      sy * sz + cy * sx * cz,

      cy * cx
    ];

    const total = Math.min(cloud.count, MAX_LINKED);
    const [ox, oy, oz] = offsetOf();
    const aspect = view.width / view.height;
    const time = state.clock;
    const radius = s.hoverRadius;
    const active = s.hoverEffect !== 0 ? pointer.active : 0;
    const spanY = s.spread * 2 + 3;
    const spanZ = s.spread * DEPTH * 2 + 3;

      const px = cloud.positions[i * 3] * s.spread;
      const py = cloud.positions[i * 3 + 1] * s.spread;
      const pz = cloud.positions[i * 3 + 2] * s.spread * DEPTH;
      const r0 = cloud.randoms[i * 4];
      const r1 = cloud.randoms[i * 4 + 1];
      const r2 = cloud.randoms[i * 4 + 2];
      const r3 = cloud.randoms[i * 4 + 3];
      const bobX = Math.sin(time * r2 + 6.28 * r3) * (0.1 + 1.4 * r0);
      const bobY = Math.sin(time * r1 + 6.28 * r0) * (0.1 + 1.4 * r3);
      const bobZ = Math.sin(time * r3 + 6.28 * r1) * (0.1 + 1.4 * r2);
      const wx = matrix[0] * px + matrix[3] * py + matrix[6] * pz + ox + bobX;
      let wy = matrix[1] * px + matrix[4] * py + matrix[7] * pz + oy + bobY;
      let wz = matrix[2] * px + matrix[5] * py + matrix[8] * pz + oz + bobZ;
      let edge = 1;
      if (s.drift === 1 || s.drift === 2) {
        const k = wrap(r3 * spanY + oy + bobY + (s.drift === 1 ? state.travel : -state.travel), spanY);
        wy = k - spanY / 2;
        const low = clamp(k / (spanY * 0.12), 0, 1);
        const high = clamp((spanY - k) / (spanY * 0.12), 0, 1);
        edge = low * low * (3 - 2 * low) * high * high * (3 - 2 * high);
      } else if (s.drift === 3) {
        const k = wrap(r1 * spanZ + oz + bobZ + state.travel, spanZ);
        wz = k - spanZ / 2;
        const fresh = clamp(k / (spanZ * 0.1), 0, 1);
        edge = fresh * fresh * (3 - 2 * fresh);
      }
      const ahead = s.camera - wz;
      if (ahead < NEAR || ahead > FAR) {
        screen.alpha[i] = 0;
        continue;
      }
      const close = clamp((ahead - 1) / 3, 0, 1);
      edge *= close * close * (3 - 2 * close);
      let sx = ((wx * FOCAL) / aspect / ahead) * 0.5 * view.width + view.width / 2;
      let sy = ((wy * FOCAL) / ahead) * 0.5 * view.height + view.height / 2;
      let dx = 0;
      let dy = 0;
      if (active > 0.001) {
        const ex = sx - pointer.sx;
        const ey = sy - pointer.sy;
        const reach = Math.hypot(ex, ey);
        const falloff = Math.exp(-(ex * ex + ey * ey) / (radius * radius)) * s.hoverFactor * active;
        if (s.hoverEffect === 1 && reach > 0.001) {
          dx += (ex / reach) * radius * 0.5 * falloff;
          dy += (ey / reach) * radius * 0.5 * falloff;
        } else if (s.hoverEffect === 2) {
          dx -= ex * 0.6 * falloff;
          dy -= ey * 0.6 * falloff;
        }
      }
      for (const burst of bursts) {
        const progress = burst.age / BURST_SECONDS;
        const ex = sx - burst.x;
        const ey = sy - burst.y;
        const reach = Math.hypot(ex, ey);
        if (reach < 0.001) continue;
        const wave = Math.exp(-Math.pow((reach - progress * BURST_SPEED) / BURST_WIDTH, 2));
        const ramp = clamp(reach / 30, 0, 1);
        const push = wave * (1 - progress) * (1 - progress) * 56 * ramp * ramp * (3 - 2 * ramp);
        dx += (ex / reach) * push;
        dy += (ey / reach) * push;

      sx += dx;
      sy += dy;
      const far = clamp((FAR - ahead) / (FAR - FAR * 0.9), 0, 1);

      screen.y[i] = sy;

  const buildLines = (s, matrix) => {
    const total = project(s, matrix);
    const reach = s.connectionDistance;
    const columns = Math.max(1, Math.ceil(view.width / reach) + 2);
    const buckets = new Map();
    for (let i = 0; i < total; i++) {
      if (screen.alpha[i] < 0.02) continue;

      if (bucket) bucket.push(i);
      else buckets.set(key, [i]);

    let lineCount = 0;
    const limit = reach * reach;
    for (const [key, members] of buckets) {
      for (const offset of [0, 1, columns - 1, columns, columns + 1]) {
        const others = offset === 0 ? members : buckets.get(key + offset);
        if (!others) continue;
        for (let a = 0; a < members.length; a++) {
          const i = members[a];
          for (let b = offset === 0 ? a + 1 : 0; b < others.length; b++) {
            const j = others[b];
            const dx = screen.x[i] - screen.x[j];
            const dy = screen.y[i] - screen.y[j];
            const gap = dx * dx + dy * dy;
            if (gap > limit) continue;
            const layer = clamp(1 - Math.abs(screen.ahead[i] - screen.ahead[j]) / 18, 0, 1);
            if (layer <= 0) continue;
            if (lineCount >= MAX_LINES) return lineCount;
            const fade = 1 - Math.sqrt(gap) / reach;
            const base = lineCount * 8;
            lineData[base] = screen.x[i];
            lineData[base + 1] = screen.y[i];
            lineData[base + 2] = screen.x[j];
            lineData[base + 3] = screen.y[j];
            lineData[base + 4] = (cloud.colors[i * 3] + cloud.colors[j * 3]) / 2;
            lineData[base + 5] = (cloud.colors[i * 3 + 1] + cloud.colors[j * 3 + 1]) / 2;
            lineData[base + 6] = (cloud.colors[i * 3 + 2] + cloud.colors[j * 3 + 2]) / 2;
            lineData[base + 7] = fade * fade * layer * 0.7 * Math.min(screen.alpha[i], screen.alpha[j]);
            lineCount++;
          }
        }
      }
    }
    return lineCount;
  };

  const render = () => {
    rebuild(s);
    const matrix = rotationOf(s);
    const [ox, oy, oz] = offsetOf();
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    if (s.connections) {
      const lineCount = buildLines(s, matrix);
      if (lineCount) {
        gl.useProgram(lines.program);
        gl.bindVertexArray(lineVao);
        gl.bindBuffer(gl.ARRAY_BUFFER, lineBuffer);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, lineData.subarray(0, lineCount * 8));
        gl.uniform2f(lines.uniforms.uView, view.width, view.height);
        gl.uniform1f(lines.uniforms.uRatio, view.ratio);
        gl.uniform1f(lines.uniforms.uWidth, 1);
        gl.uniform1f(lines.uniforms.uOpacity, s.opacity);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, lineCount);
      }
    }

    const u = dots.uniforms;
    let burstCount = 0;
    for (let i = bursts.length - 1; i >= 0 && burstCount < MAX_BURSTS; i--) {
      packedBursts.set([bursts[i].x, bursts[i].y, bursts[i].age / BURST_SECONDS, 1], burstCount * 4);
      burstCount++;
    }
    gl.useProgram(dots.program);
    gl.bindVertexArray(dotVao);
    gl.uniformMatrix3fv(u.uRotation, false, matrix);
    gl.uniform3f(u.uOffset, ox, oy, oz);
    gl.uniform1f(u.uSpread, s.spread);
    gl.uniform1f(u.uTime, state.clock);
    gl.uniform1f(u.uCamera, s.camera);
    gl.uniform1f(u.uAspect, view.width / view.height);
    gl.uniform2f(u.uView, view.width, view.height);
    gl.uniform1f(u.uRatio, view.ratio);
    gl.uniform1f(u.uSize, s.size);
    gl.uniform1f(u.uRandomness, s.randomness);
    gl.uniform1f(u.uBlur, s.depthOfField * 14);
    gl.uniform1f(u.uFocus, s.camera + 14);
    gl.uniform1f(u.uGlow, s.lightMode ? s.glow * 0.3 : s.glow);
    gl.uniform1f(u.uTwinkle, s.twinkle);
    gl.uniform1i(u.uShape, s.shape);
    gl.uniform1i(u.uDrift, s.drift);
    gl.uniform1f(u.uTravel, state.travel);
    gl.uniform4f(u.uPointer, pointer.sx, pointer.sy, pointer.active, s.hoverRadius);
    gl.uniform1i(u.uEffect, s.hoverEffect);
    gl.uniform1f(u.uStrength, s.hoverFactor);
    gl.uniform4fv(u.uBursts, packedBursts);
    gl.uniform1i(u.uBurstCount, burstCount);
    gl.uniform1f(u.uReveal, state.reveal);
    gl.uniform1f(u.uSoft, s.soft ? 0.2 : 0);
    gl.uniform1f(u.uShimmer, s.lightMode ? 0 : 1);
    gl.uniform1f(u.uOpacity, s.opacity);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, cloud.count);
    gl.bindVertexArray(null);
  };

  const frame = now => {
    raf = 0;
    if (!visible || document.hidden) return;
    const dt = last ? clamp((now - last) / 1000, 0.0005, 0.05) : 1 / 60;
    last = now;
    if (s.paused) {
      state.reveal = 1;
      render();
      last = 0;
      return;
    }
    const motion = reduce ? 0 : 1;
    const pace = dt * s.speed * motion;
    state.clock += pace;
    if (s.rotate) state.spin += pace * 0.6;
    state.travel += dt * s.driftSpeed * motion * (s.drift === 3 ? 6 : 0.9);

    const engaged = s.mouse && pointer.inside && !reduce;
    const follow = 1 - Math.exp(-dt / 0.35);
    const parallax = engaged && s.hoverEffect === 0 ? s.hoverFactor : 0;
    state.offsetX += (-pointer.nx * parallax - state.offsetX) * follow;
    state.offsetY += (-pointer.ny * parallax - state.offsetY) * follow;
    pointer.sx += (pointer.x - pointer.sx) * (1 - Math.exp(-dt / 0.06));
    pointer.sy += (pointer.y - pointer.sy) * (1 - Math.exp(-dt / 0.06));
    pointer.active += ((engaged ? 1 : 0) - pointer.active) * (1 - Math.exp(-dt / 0.2));

    for (let i = bursts.length - 1; i >= 0; i--) {
      bursts[i].age += dt;
      if (bursts[i].age >= BURST_SECONDS) bursts.splice(i, 1);
    }

    if (!s.intro || reduce) state.reveal = 1;
    else if (state.reveal < 1) state.reveal = Math.min(1, state.reveal + dt / INTRO_SECONDS);

    render();
    raf = requestAnimationFrame(frame);
  };

  const wake = () => {
    if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame);
  };

  const resize = () => {
    const width = Math.max(1, container.clientWidth);
    const height = Math.max(1, container.clientHeight);
    const ratio = Math.min(s.dpr || window.devicePixelRatio || 1, 2);
    view.width = width;
    view.height = height;
    canvas.width = Math.max(1, Math.round(width * ratio));
    canvas.height = Math.max(1, Math.round(height * ratio));
    view.ratio = canvas.width / width;
    render();
    wake();
  };

  const locate = event => {
    const rect = container.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    const wasInside = pointer.inside;
    pointer.inside = x >= 0 && y >= 0 && x <= rect.width && y <= rect.height;
    pointer.x = x;
    pointer.y = rect.height - y;
    pointer.nx = (x / Math.max(1, rect.width)) * 2 - 1;
    pointer.ny = -((y / Math.max(1, rect.height)) * 2 - 1);
    if (pointer.inside && !wasInside) {
      pointer.sx = pointer.x;
      pointer.sy = pointer.y;
    }
  };

  const onPointerMove = event => {
    locate(event);
    if (!s.paused) wake();
  };

  const onPointerDown = event => {
    locate(event);
    if (!pointer.inside || !s.clickBurst || s.paused || reduce) return;
    bursts.push({ x: pointer.x, y: pointer.y, age: 0 });
    if (bursts.length > MAX_BURSTS) bursts.shift();
    wake();
  };

  const onPointerUp = event => {
    if (event.pointerType !== 'mouse') pointer.inside = false;
  };

  const onPointerLeave = () => {
    pointer.inside = false;
  };

  const onVisibility = () => {
    last = 0;
    wake();
  };

  new ResizeObserver(resize).observe(container);
  new IntersectionObserver(entries => {
    visible = entries.some(entry => entry.isIntersecting);
    if (visible) {
      last = 0;
      wake();
    }
  }).observe(container);
  window.addEventListener('pointermove', onPointerMove, { passive: true });
  window.addEventListener('pointerdown', onPointerDown, { passive: true });
  window.addEventListener('pointerup', onPointerUp, { passive: true });
  window.addEventListener('pointercancel', onPointerUp, { passive: true });
  document.documentElement.addEventListener('pointerleave', onPointerLeave);
  document.addEventListener('visibilitychange', onVisibility);
  resize();
}

    if (!ctx) return fallback;
    ctx.fillStyle = '#000000';
    ctx.fillStyle = value;
    const resolved = ctx.fillStyle;
    if (resolved.startsWith('#')) {
      const n = parseInt(resolved.slice(1), 16);
      return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255, 1];

    if (!parts || parts.length < 3) return fallback;
    return [Number(parts[0]) / 255, Number(parts[1]) / 255, Number(parts[2]) / 255, parts[3] ? Number(parts[3]) : 1];

const vorticityFragment = `${fluidHead}
uniform sampler2D uVelocity;

  float right = vR.x > 1.0 ? -middle.x : texture(uVelocity, vR).x;
  float top = vT.y > 1.0 ? -middle.y : texture(uVelocity, vT).y;
  float bottom = vB.y < 0.0 ? -middle.y : texture(uVelocity, vB).y;

const pressureFragment = `${fluidHead}
uniform sampler2D uPressure;

const projectFragment = `${fluidHead}
uniform sampler2D uPressure;
uniform sampler2D uVelocity;

  float right = texture(uPressure, vR).x;

const advectFragment = `${fluidHead}
uniform sampler2D uVelocity;
uniform sampler2D uSource;

uniform float uDt;

const scaleFragment = `${fluidHead}
uniform sampler2D uSource;
uniform float uValue;
void main() {
  fragColor = texture(uSource, vUv) * uValue;
}

const fieldFragment = `#version 300 es

uniform vec2 uSize;
uniform vec4 uGrid;
uniform vec2 uOrigin;
uniform vec2 uSlat;

uniform float uScale;
uniform float uDirection;
uniform float uChop;
uniform float uStretch;
uniform float uGlint;
uniform float uContrast;
uniform float uPerspective;
uniform float uFog;
uniform float uIntro;
uniform sampler2D tVelocity;
uniform sampler2D tInk;
uniform vec2 uFluidTexel;
uniform float uFluid;
uniform float uInk;
uniform float uLean;
out vec4 fragColor;

const float TURN[4] = float[4](0.0, -0.95, 0.78, 1.62);
const float LENGTH[4] = float[4](2.6, 1.7, 1.12, 0.76);
const float HEIGHT[4] = float[4](1.0, 0.75, 0.5, 0.3);
const float SHIFT[4] = float[4](0.0, 2.3, 4.1, 1.1);

  vec2 cell = floor(gl_FragCoord.xy);
  float row = uGrid.y - 1.0 - cell.y;
  vec2 center = uOrigin + vec2(cell.x, row) * uGrid.zw + uSlat * 0.5;
  float v = clamp(center.y / uSize.y, 0.0, 1.0);

  vec2 flow = vec2(0.0);
  float ink = 0.0;
  if (uFluid > 0.5) {
    vec2 fluidUv = clamp(vec2(center.x / uSize.x, 1.0 - center.y / uSize.y), 0.0, 1.0);

    ink = texture(tInk, fluidUv).x;

  float depth = (1.0 + horizon) / (v + horizon);
  vec2 world = vec2((center.x - uSize.x * 0.5) / uSize.y * depth, (depth - 1.0) * horizon * 2.2);
  world -= flow * 0.00018 * depth;

    vec2 heading = vec2(cos(angle), sin(angle));
    float k = 6.2831853 / LENGTH[i];
    float omega = sqrt(9.81 * k) * 0.35;
    float theta = k * dot(world, heading) - omega * uTime + SHIFT[i] + meander * (0.6 + 0.3 * float(i));

  float glow = 1.0 - exp(-max(ink, 0.0) * uInk * 1.6);
  light = 1.0 - (1.0 - clamp(light, 0.0, 1.0)) * (1.0 - glow);

  float front = uIntro * 1.35;
  float reveal = 1.0 - smoothstep(front - 0.35, front, v);
  float sweep = exp(-pow((v - front + 0.22) / 0.07, 2.0)) * (1.0 - uIntro);
  light = (light + sweep * 0.8) * reveal;

}
`;

const slatFragment = `#version 300 es
precision highp float;
uniform sampler2D tField;
uniform vec2 uSize;
uniform float uDpr;
uniform vec4 uGrid;
uniform vec2 uOrigin;
uniform vec2 uSlat;
uniform float uRound;
uniform float uTilt;
uniform vec3 uColor;
uniform vec3 uGlintColor;
uniform vec4 uBackground;

float pill(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uSize.y * uDpr - gl_FragCoord.y) / uDpr;
  vec2 local = p - uOrigin;
  vec2 cell = floor(local / uGrid.zw);
  vec4 background = vec4(uBackground.rgb * uBackground.a, uBackground.a);
  vec4 slat = vec4(0.0);
  int reach = uTilt > 0.0 ? 1 : 0;
  for (int dx = -1; dx <= 1; dx++) {
    if (abs(dx) > reach) continue;
    vec2 neighbour = cell + vec2(float(dx), 0.0);
    if (neighbour.x < 0.0 || neighbour.y < 0.0 || neighbour.x >= uGrid.x || neighbour.y >= uGrid.y) continue;
    vec4 field = texelFetch(tField, ivec2(int(neighbour.x), int(uGrid.y - 1.0 - neighbour.y)), 0);

    float angle = (field.a - 0.5) * 2.0 * uTilt;
    float c = cos(angle);
    float s = sin(angle);
    vec2 turned = vec2(c * offset.x + s * offset.y, c * offset.y - s * offset.x);
    vec2 halfSize = vec2(uSlat.x * 0.5, uSlat.y * 0.5 * field.g);
    float radius = uRound * min(halfSize.x, halfSize.y);
    float alpha = clamp(0.5 - pill(turned, halfSize, radius) * uDpr, 0.0, 1.0) * field.r;

    width: 1,
    height: 1,
    depth: false,
    minFilter: gl.NEAREST,
    magFilter: gl.NEAREST

    uSize: { value: [1, 1] },
    uGrid: { value: [1, 1, 1, 1] },
    uOrigin: { value: [0, 0] },
    uSlat: { value: [1, 1] },
    uTime: { value: 0 },
    uScale: { value: 1 },
    uDirection: { value: 0 },
    uChop: { value: 0.5 },
    uStretch: { value: 0.3 },
    uGlint: { value: 1 },
    uContrast: { value: 1 },
    uPerspective: { value: 0.7 },
    uFog: { value: 0.5 },
    uIntro: { value: 0 },
    tVelocity: { value: blank },
    tInk: { value: blank },
    uFluidTexel: { value: [1, 1] },
    uFluid: { value: 0 },
    uInk: { value: 1 },
    uLean: { value: 0.5 }

      depthTest: false,
      depthWrite: false

    tField: { value: fieldTarget.texture },
    uSize: { value: [1, 1] },
    uDpr: { value: 1 },
    uGrid: { value: [1, 1, 1, 1] },
    uOrigin: { value: [0, 0] },
    uSlat: { value: [1, 1] },
    uRound: { value: 1 },
    uTilt: { value: 0 },
    uColor: { value: [1, 1, 1] },
    uGlintColor: { value: [1, 1, 1] },
    uBackground: { value: [0, 0, 0, 1] }

  const slatMesh = new Mesh(gl, {
    geometry,
    program: new Program(gl, {
      vertex: passVertex,
      fragment: slatFragment,
      uniforms: slatUniforms,

      depthWrite: false

      program: new Program(gl, {

        uniforms: { uTexel: fluidTexel, ...uniforms },
        depthTest: false,
        depthWrite: false

    uTarget: { value: blank },

  const pressurePass = fluidPass(pressureFragment, { uPressure: { value: blank }, uDivergence: { value: blank } });

  const advectPass = fluidPass(advectFragment, {

  let height = 1;
  let raf = 0;
  let last = performance.now();

  let introClock = 0;
  let visible = true;
  let fluid = null;
  let fluidUntil = 0;
  let fluidDirty = false;
  let splashTurn = 0;
  const splats = [];

  const run = (mesh, target) => renderer.render({ scene: mesh, target, clear: false });

  const floatTarget = (w, h) =>
    new RenderTarget(gl, {
      width: w,
      height: h,
      depth: false,
      type: gl.HALF_FLOAT,
      format: gl.RGBA,
      internalFormat: gl.RGBA16F,
      minFilter: gl.LINEAR,
      magFilter: gl.LINEAR

  const swapPair = (w, h) => ({
    read: floatTarget(w, h),
    write: floatTarget(w, h),
    swap() {
      const next = this.read;
      this.read = this.write;
      this.write = next;
    }
  });

  const disposeFluid = () => {
    if (!fluid) return;
    [fluid.velocity, fluid.ink, fluid.pressure].forEach(pair => {
      dispose(pair.read);
      dispose(pair.write);
    });
    dispose(fluid.divergence);
    dispose(fluid.curl);
    fluid = null;
  };

  const buildFluid = () => {
    if (!floatTargets) return;
    const aspect = width / height;
    const w = Math.max(8, Math.round(aspect >= 1 ? FLUID_SIZE * aspect : FLUID_SIZE));
    const h = Math.max(8, Math.round(aspect >= 1 ? FLUID_SIZE : FLUID_SIZE / aspect));
    if (fluid && fluid.width === w && fluid.height === h) return;
    disposeFluid();
    fluid = {
      width: w,
      height: h,
      velocity: swapPair(w, h),
      ink: swapPair(w, h),
      pressure: swapPair(w, h),
      divergence: floatTarget(w, h),
      curl: floatTarget(w, h)
    };
    fluidTexel.value = [1 / w, 1 / h];
  };

  const resize = () => {
    width = Math.max(1, container.clientWidth);
    height = Math.max(1, container.clientHeight);
    renderer.dpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(PIXEL_BUDGET / (width * height)));
    renderer.setSize(width, height);
    buildFluid();
    start();
  };

  const layout = s => {
    const slatW = clamp(s.slatWidth, 1, 64);
    const slatH = clamp(s.slatHeight, 2, 240);
    const gapSize = clamp(s.gap, 0, 64);
    const pitchX = slatW + gapSize;
    const pitchY = slatH + gapSize;
    const cols = Math.min(2048, Math.ceil((width + gapSize) / pitchX) + 1);
    const rows = Math.min(2048, Math.ceil((height + gapSize) / pitchY) + 1);
    const originX = (width - (cols * pitchX - gapSize)) / 2;
    const originY = (height - (rows * pitchY - gapSize)) / 2;
    if (fieldTarget.width !== cols || fieldTarget.height !== rows) {
      dispose(fieldTarget);
      fieldTarget = new RenderTarget(gl, {
        width: cols,
        height: rows,
        depth: false,
        minFilter: gl.NEAREST,
        magFilter: gl.NEAREST
      });
      slatUniforms.tField.value = fieldTarget.texture;
    }
    const tilt = Math.min(0.42, Math.asin(clamp((pitchX * 1.5 - slatW * 0.5) / (slatH * 0.5), 0, 1)));
    return { slatW, slatH, tilt, grid: [cols, rows, pitchX, pitchY], origin: [originX, originY] };
  };

  const splat = (pair, point, value, radius) => {
    const u = splatPass.program.uniforms;
    u.uTarget.value = pair.read.texture;
    u.uAspect.value = width / height;
    u.uPoint.value = point;
    u.uValue.value = value;
    u.uRadius.value = radius;
    run(splatPass, pair.write);
    pair.swap();
  };

  const stepFluid = (f, dt, s) => {
    if (s.swirl > 0) {
      curlPass.program.uniforms.uVelocity.value = f.velocity.read.texture;
      run(curlPass, f.curl);

      const vorticity = vorticityPass.program.uniforms;
      vorticity.uVelocity.value = f.velocity.read.texture;
      vorticity.uCurl.value = f.curl.texture;
      vorticity.uSwirl.value = clamp(s.swirl, 0, 2) * 40;
      vorticity.uDt.value = dt;
      run(vorticityPass, f.velocity.write);
      f.velocity.swap();
    }

    divergencePass.program.uniforms.uVelocity.value = f.velocity.read.texture;
    run(divergencePass, f.divergence);

    scalePass.program.uniforms.uSource.value = f.pressure.read.texture;
    scalePass.program.uniforms.uValue.value = 0.8;
    run(scalePass, f.pressure.write);
    f.pressure.swap();

    pressurePass.program.uniforms.uDivergence.value = f.divergence.texture;
    for (let i = 0; i < PRESSURE_STEPS; i++) {
      pressurePass.program.uniforms.uPressure.value = f.pressure.read.texture;
      run(pressurePass, f.pressure.write);
      f.pressure.swap();
    }

    projectPass.program.uniforms.uPressure.value = f.pressure.read.texture;
    projectPass.program.uniforms.uVelocity.value = f.velocity.read.texture;
    run(projectPass, f.velocity.write);
    f.velocity.swap();

    const fade = 1 / clamp(s.trail, 0.1, 10);
    const advect = advectPass.program.uniforms;
    advect.uDt.value = dt;
    advect.uVelocity.value = f.velocity.read.texture;
    advect.uSource.value = f.velocity.read.texture;
    advect.uFade.value = fade * 1.4;
    run(advectPass, f.velocity.write);
    f.velocity.swap();

    advect.uVelocity.value = f.velocity.read.texture;
    advect.uSource.value = f.ink.read.texture;
    advect.uFade.value = fade;
    run(advectPass, f.ink.write);
    f.ink.swap();
  };

  const clearFluid = f => {
    scalePass.program.uniforms.uValue.value = 0;
    [f.velocity, f.ink, f.pressure].forEach(pair => {
      scalePass.program.uniforms.uSource.value = pair.read.texture;
      run(scalePass, pair.write);
      pair.swap();
    });
  };

  const frame = now => {
    raf = 0;
    const s = s0;
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;

    if (!s.paused && !reducedMotion) time += dt * s.speed;
    introClock = s.intro && !reducedMotion ? introClock + dt / Math.max(0.2, s.introDuration) : 1;
    const introLinear = Math.min(introClock, 1);
    const introEase =
      introLinear < 0.5 ? 4 * introLinear * introLinear * introLinear : 1 - Math.pow(-2 * introLinear + 2, 3) / 2;

    if (fluid && splats.length) {
      const radius = Math.pow(clamp(s.cursorSize, 4, 600) / height, 2) * 0.35;
      const aspect = width / height;
      for (const [u, v, du, dv, turn] of splats) {
        if (turn === null) {
          splat(fluid.velocity, [u, v], [du * SPLAT_FORCE, dv * SPLAT_FORCE, 0], radius);
          splat(fluid.ink, [u, v], [0.13, 0, 0], radius);
          continue;
        }
        const jet = radius * 0.55;
        const reach = Math.sqrt(jet * 0.5) * 1.9;
        const push = SPLAT_FORCE * 0.08;
        for (let i = 0; i < SPLASH_JETS; i++) {
          const angle = turn + (i / SPLASH_JETS) * Math.PI * 2;
          const dx = Math.cos(angle);
          const dy = Math.sin(angle);
          const point = [u + (dx * reach) / aspect, v + dy * reach];
          const spin = [(dx - dy) * Math.SQRT1_2 * push, (dy + dx) * Math.SQRT1_2 * push, 0];
          splat(fluid.velocity, point, spin, jet);
          splat(fluid.ink, point, [0.75, 0, 0], jet);
        }
        splat(fluid.ink, [u, v], [0.45, 0, 0], radius);
      }
      splats.length = 0;
      fluidDirty = true;
    }
    const fluidActive = fluid !== null && now < fluidUntil;
    if (fluid) {
      if (fluidActive) stepFluid(fluid, Math.min(Math.max(dt, 1 / 240), 1 / 30), s);
      else if (fluidDirty) {
        clearFluid(fluid);
        fluidDirty = false;
      }
    }

    const grid = layout(s);

    fieldUniforms.uSize.value = [width, height];
    fieldUniforms.uGrid.value = grid.grid;
    fieldUniforms.uOrigin.value = grid.origin;
    fieldUniforms.uSlat.value = [grid.slatW, grid.slatH];
    fieldUniforms.uTime.value = time;
    fieldUniforms.uScale.value = s.scale;
    fieldUniforms.uDirection.value = (s.direction * Math.PI) / 180;
    fieldUniforms.uChop.value = clamp(s.chop, 0, 1.5);
    fieldUniforms.uStretch.value = clamp(s.stretch, 0, 0.95);
    fieldUniforms.uGlint.value = Math.max(0, s.glint);
    fieldUniforms.uContrast.value = clamp(s.contrast, 0.2, 4);
    fieldUniforms.uPerspective.value = clamp(s.perspective, 0, 1);
    fieldUniforms.uFog.value = clamp(s.fog, 0, 1);
    fieldUniforms.uIntro.value = introEase;
    fieldUniforms.uFluid.value = fluidActive ? 1 : 0;
    fieldUniforms.tVelocity.value = fluid ? fluid.velocity.read.texture : blank;
    fieldUniforms.tInk.value = fluid ? fluid.ink.read.texture : blank;
    fieldUniforms.uFluidTexel.value = fluidTexel.value;
    fieldUniforms.uInk.value = clamp(s.cursorStrength, 0, 3);
    fieldUniforms.uLean.value = clamp(s.lean, 0, 1);
    renderer.render({ scene: fieldMesh, target: fieldTarget });

    slatUniforms.uSize.value = [width, height];
    slatUniforms.uDpr.value = renderer.dpr;
    slatUniforms.uGrid.value = grid.grid;
    slatUniforms.uOrigin.value = grid.origin;
    slatUniforms.uSlat.value = [grid.slatW, grid.slatH];
    slatUniforms.uRound.value = clamp(s.roundness, 0, 1);
    slatUniforms.uTilt.value = fluidActive && s.lean > 0 ? grid.tilt : 0;
    slatUniforms.uColor.value = s.color.slice(0, 3);
    slatUniforms.uGlintColor.value = s.glintColor.slice(0, 3);
    slatUniforms.uBackground.value = s.backgroundColor;
    renderer.render({ scene: slatMesh });

    const moving = (!s.paused && !reducedMotion && s.speed !== 0) || introClock < 1;
    if (visible && (moving || fluidActive || fluidDirty)) raf = requestAnimationFrame(frame);
  };

  function start() {
    if (raf || !visible) return;
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }

  const locate = e => {
    const rect = container.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const w = Math.max(1, rect.width);
    const h = Math.max(1, rect.height);
    return { x, y, u: x / w, v: 1 - y / h, h, inside: x >= 0 && y >= 0 && x <= w && y <= h };
  };

  const queue = (u, v, du, dv, turn) => {
    if (splats.length > 32) splats.shift();
    splats.push([u, v, du, dv, turn]);
    fluidUntil = performance.now() + Math.max(1.5, s0.trail * 5) * 1000;
    start();
  };

  const onPointerMove = e => {
    const spot = locate(e);
    if (!fluid || !s0.interactive || reducedMotion || !spot.inside) {
      pointer.tracked = false;
      return;
    }
    if (pointer.tracked && (spot.x !== pointer.x || spot.y !== pointer.y)) {
      queue(spot.u, spot.v, (spot.x - pointer.x) / spot.h, (pointer.y - spot.y) / spot.h, null);
    }
    pointer.x = spot.x;
    pointer.y = spot.y;
    pointer.tracked = true;
  };

  const onPointerDown = e => {
    const spot = locate(e);
    if (!fluid || !s0.interactive || reducedMotion || !spot.inside) return;
    splashTurn += 2.39996;
    queue(spot.u, spot.v, 0, 0, splashTurn);
  };

  const onPointerLeave = () => {
    pointer.tracked = false;
  };

  const onPointerOut = e => {
    if (!e.relatedTarget) onPointerLeave();
  };

  const onVisibility = () => {
    if (!document.hidden) start();
  };

  window.addEventListener('pointermove', onPointerMove, { passive: true });
  window.addEventListener('pointerdown', onPointerDown, { passive: true });
  window.addEventListener('pointerout', onPointerOut, { passive: true });
  window.addEventListener('blur', onPointerLeave);
  document.addEventListener('visibilitychange', onVisibility);

  new ResizeObserver(resize).observe(container);
  new IntersectionObserver(([entry]) => {
    visible = entry.isIntersecting;
    start();
  }).observe(container);

  resize();
}

if (useSlats) mountMicroSlats(document.getElementById('slats'), {
  preset: 'swell',
  color: '#2a4050',
  glintColor: '#6ee7ff',
  glint: 1,
  contrast: 1,
  fog: 0.3,
  backgroundColor: '#0a0b0d',
  slatWidth: 10,
  slatHeight: 25,
  gap: 3,
  roundness: 0.75,
  interactive: true,
  cursorStrength: 1,
  cursorSize: 40,
  swirl: 0,
  trail: 1.4,
  lean: 0,
  intro: true
});
</script>
</body>
</html>
